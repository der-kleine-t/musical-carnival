<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Geschuetzter Zugriff - Vokabeltrainer</title>
<style>
  :root {
    --bg: #f5f0e8;
    --card-bg: #fffdf7;
    --ink: #1a1208;
    --accent: #c8471a;
    --accent2: #2a6b4f;
    --muted: #8a7b6a;
    --border: #d4c9b4;
    --error-bg: #ffe8e2;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    min-height: 100vh;
    font-family: "Menlo", "Monaco", "Courier New", monospace;
    color: var(--ink);
    background:
      radial-gradient(circle at 10% 15%, #f0e3cf 0%, transparent 40%),
      radial-gradient(circle at 85% 80%, #e2efe7 0%, transparent 42%),
      var(--bg);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }

  .card {
    width: 100%;
    max-width: 520px;
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 28px;
    box-shadow: 0 12px 30px rgba(26, 18, 8, 0.12);
  }

  h1 {
    font-family: "Georgia", "Times New Roman", serif;
    font-size: 1.9rem;
    font-weight: 600;
    margin-bottom: 8px;
    letter-spacing: -0.02em;
  }

  .subtitle {
    color: var(--muted);
    font-size: 0.72rem;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    margin-bottom: 22px;
  }

  .info {
    font-size: 0.85rem;
    line-height: 1.55;
    margin-bottom: 18px;
  }

  form {
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  label {
    font-size: 0.72rem;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.08em;
  }

  input {
    width: 100%;
    padding: 12px 14px;
    border: 1.5px solid var(--border);
    border-radius: 8px;
    background: #ffffff;
    color: var(--ink);
    font-size: 1rem;
    font-family: inherit;
  }

  input:focus {
    outline: none;
    border-color: var(--accent);
  }

  button {
    margin-top: 4px;
    border: none;
    border-radius: 8px;
    padding: 12px 14px;
    background: linear-gradient(120deg, var(--accent), #d9623a);
    color: #fff;
    font-family: inherit;
    font-size: 0.82rem;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    cursor: pointer;
    font-weight: 700;
  }

  button:hover { filter: brightness(1.05); }
  button:disabled { opacity: 0.7; cursor: wait; }

  .msg {
    margin-top: 12px;
    min-height: 20px;
    font-size: 0.82rem;
  }

  .msg.error {
    color: var(--accent);
    background: var(--error-bg);
    border: 1px solid #f3cabd;
    border-radius: 6px;
    padding: 8px 10px;
  }

  .msg.ok {
    color: var(--accent2);
  }

  .hint {
    margin-top: 18px;
    color: var(--muted);
    font-size: 0.7rem;
    line-height: 1.5;
  }
</style>
</head>
<body>
  <main class="card">
    <h1>Vokabeltrainer A1/A2</h1>
    <p class="info"></p>

    <form id="unlockForm">
      <label for="passwordInput">Passwort</label>
      <input id="passwordInput" type="password" autocomplete="current-password" required placeholder="Passwort eingeben">
      <button id="unlockBtn" type="submit">Entsperren</button>
      <div id="message" class="msg" aria-live="polite"></div>
    </form>

    <p class="hint"></p>
  </main>

<script>
const PAYLOAD_URL = "./protected-content.json";
const SESSION_HTML_KEY = "rivstart_unlocked_html_v1";
const PERSISTENT_HTML_KEY = "rivstart_unlocked_html_persistent_v1";

async function restoreFromSession() {
  try {
    // Try session storage first (lives only for current session)
    const sessionHtml = sessionStorage.getItem(SESSION_HTML_KEY);
    if (sessionHtml) {
      document.open();
      document.write(sessionHtml);
      document.close();
      return true;
    }

    // Fall back to persistent cache for browser restarts
    const cachedHtml = localStorage.getItem(PERSISTENT_HTML_KEY);
    if (!cachedHtml) {
      return false;
    }

    // Restore persistent cache silently
    sessionStorage.setItem(SESSION_HTML_KEY, cachedHtml);
    document.open();
    document.write(cachedHtml);
    document.close();
    return true;
  } catch (error) {
    return false;
  }
}

function b64ToBytes(b64) {
  const binary = atob(b64);
  const bytes = new Uint8Array(binary.length);
  for (let i = 0; i < binary.length; i += 1) {
    bytes[i] = binary.charCodeAt(i);
  }
  return bytes;
}

async function deriveAesKey(password, saltBytes, iterations) {
  const enc = new TextEncoder();
  const baseKey = await crypto.subtle.importKey(
    "raw",
    enc.encode(password),
    { name: "PBKDF2" },
    false,
    ["deriveBits"]
  );

  const keyBits = await crypto.subtle.deriveBits(
    {
      name: "PBKDF2",
      salt: saltBytes,
      iterations,
      hash: "SHA-256"
    },
    baseKey,
    512
  );

  const keyMaterial = new Uint8Array(keyBits);
  const aesKeyBytes = keyMaterial.slice(0, 32);
  const macKeyBytes = keyMaterial.slice(32, 64);

  const aesKey = await crypto.subtle.importKey(
    "raw",
    aesKeyBytes,
    { name: "AES-CBC" },
    false,
    ["decrypt"]
  );

  const macKey = await crypto.subtle.importKey(
    "raw",
    macKeyBytes,
    { name: "HMAC", hash: "SHA-256" },
    false,
    ["verify"]
  );

  return { aesKey, macKey };
}

async function unlock(event) {
  event.preventDefault();

  const form = document.getElementById("unlockForm");
  const input = document.getElementById("passwordInput");
  const button = document.getElementById("unlockBtn");
  const message = document.getElementById("message");

  const password = input.value;
  if (!password) return;

  button.disabled = true;
  message.className = "msg ok";
  message.textContent = "Entschluesselung laeuft...";

  try {
    const response = await fetch(PAYLOAD_URL, { cache: "no-store" });
    if (!response.ok) {
      throw new Error("Payload konnte nicht geladen werden.");
    }

    const payload = await response.json();
    const salt = b64ToBytes(payload.kdf.salt);
    const iv = b64ToBytes(payload.cipher.iv);
    const encrypted = b64ToBytes(payload.cipher.data);
    const mac = b64ToBytes(payload.cipher.mac);

    const keys = await deriveAesKey(password, salt, payload.kdf.iterations);
    const macInput = new Uint8Array(iv.length + encrypted.length);
    macInput.set(iv, 0);
    macInput.set(encrypted, iv.length);

    const macValid = await crypto.subtle.verify(
      "HMAC",
      keys.macKey,
      mac,
      macInput
    );

    if (!macValid) {
      throw new Error("MAC verification failed.");
    }

    const decryptedBuffer = await crypto.subtle.decrypt(
      {
        name: "AES-CBC",
        iv
      },
      keys.aesKey,
      encrypted
    );

    const html = new TextDecoder().decode(decryptedBuffer);

    try {
      // Store in session storage for current session
      sessionStorage.setItem(SESSION_HTML_KEY, html);
      // Persist across browser restarts
      localStorage.setItem(PERSISTENT_HTML_KEY, html);
    } catch (error) {
      // Ignore storage failures and continue with direct render.
    }

    document.open();
    document.write(html);
    document.close();
  } catch (error) {
    message.className = "msg error";
    message.textContent = "Passwort falsch oder Daten ungueltig.";
    input.focus();
    form.reset();
  } finally {
    button.disabled = false;
  }
}

restoreFromSession().then(restored => {
  if (!restored) {
    document.getElementById("passwordInput").focus();
  }
});

document.getElementById("unlockForm").addEventListener("submit", unlock);
</script>
</body>
</html>
