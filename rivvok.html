<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,300;0,600;1,300&family=DM+Mono:wght@400;500&display=swap');

:root {
–bg: #f5f0e8;
–card-bg: #fffdf7;
–ink: #1a1208;
–accent: #c8471a;
–accent2: #2a6b4f;
–muted: #8a7b6a;
–border: #d4c9b4;
–known: #2a6b4f;
–unknown: #c8471a;
–skip: #8a7b6a;
}

- { margin:0; padding:0; box-sizing:border-box; }

body {
font-family: ‘DM Mono’, monospace;
background: var(–bg);
color: var(–ink);
min-height: 100vh;
display: flex;
flex-direction: column;
align-items: center;
}

/* HEADER */
header {
width: 100%;
padding: 20px 30px 16px;
display: flex;
align-items: baseline;
gap: 12px;
border-bottom: 1px solid var(–border);
background: var(–bg);
position: sticky;
top: 0;
z-index: 10;
}

header h1 {
font-family: ‘Fraunces’, serif;
font-size: 1.5rem;
font-weight: 600;
letter-spacing: -0.02em;
}

header .subtitle {
font-size: 0.7rem;
color: var(–muted);
letter-spacing: 0.08em;
text-transform: uppercase;
}

/* STATS BAR */
.stats-bar {
width: 100%;
max-width: 680px;
display: flex;
gap: 8px;
padding: 14px 20px 0;
font-size: 0.65rem;
letter-spacing: 0.06em;
text-transform: uppercase;
color: var(–muted);
}

.stat {
display: flex;
align-items: center;
gap: 5px;
padding: 4px 10px;
border: 1px solid var(–border);
border-radius: 20px;
background: var(–card-bg);
}

.stat .dot {
width: 7px; height: 7px;
border-radius: 50%;
}
.stat.s-total .dot { background: var(–muted); }
.stat.s-known .dot { background: var(–known); }
.stat.s-unknown .dot { background: var(–unknown); }
.stat.s-due { border-color: var(–accent); color: var(–accent); }

/* PROGRESS BAR */
.progress-wrap {
width: 100%;
max-width: 680px;
padding: 10px 20px 0;
}

.progress-track {
width: 100%;
height: 3px;
background: var(–border);
border-radius: 2px;
overflow: hidden;
}

.progress-fill {
height: 100%;
background: var(–accent2);
border-radius: 2px;
transition: width 0.4s ease;
}

/* CHAPTER FILTER */
.chapter-filter {
width: 100%;
max-width: 680px;
padding: 12px 20px 0;
display: flex;
flex-wrap: wrap;
gap: 6px;
}

.ch-btn {
font-family: ‘DM Mono’, monospace;
font-size: 0.6rem;
padding: 3px 9px;
border: 1px solid var(–border);
border-radius: 12px;
background: var(–card-bg);
color: var(–muted);
cursor: pointer;
transition: all 0.15s;
letter-spacing: 0.04em;
}

.ch-btn:hover { border-color: var(–ink); color: var(–ink); }
.ch-btn.active { background: var(–ink); color: var(–bg); border-color: var(–ink); }

/* CARD AREA */
.card-area {
flex: 1;
display: flex;
flex-direction: column;
align-items: center;
justify-content: center;
padding: 30px 20px;
width: 100%;
max-width: 680px;
}

.card-wrap {
perspective: 1200px;
width: 100%;
max-width: 500px;
height: 280px;
}

.card {
width: 100%;
height: 100%;
position: relative;
transform-style: preserve-3d;
transition: transform 0.5s cubic-bezier(.4,0,.2,1);
cursor: pointer;
}

.card.flipped { transform: rotateY(180deg); }

.card-face {
position: absolute;
inset: 0;
backface-visibility: hidden;
border: 1px solid var(–border);
border-radius: 4px;
background: var(–card-bg);
display: flex;
flex-direction: column;
align-items: center;
justify-content: center;
padding: 30px;
box-shadow: 2px 3px 0 var(–border);
}

.card-back { transform: rotateY(180deg); }

.card-chapter {
position: absolute;
top: 12px;
left: 16px;
font-size: 0.6rem;
color: var(–muted);
letter-spacing: 0.1em;
text-transform: uppercase;
}

.card-number {
position: absolute;
top: 12px;
right: 16px;
font-size: 0.6rem;
color: var(–muted);
}

.card-word {
font-family: ‘Fraunces’, serif;
font-size: 2.8rem;
font-weight: 300;
letter-spacing: -0.03em;
text-align: center;
line-height: 1.1;
}

.card-article {
font-size: 0.7rem;
color: var(–muted);
margin-bottom: 4px;
letter-spacing: 0.06em;
}

.card-hint {
position: absolute;
bottom: 14px;
font-size: 0.6rem;
color: var(–muted);
letter-spacing: 0.06em;
}

.card-translation {
font-family: ‘Fraunces’, serif;
font-size: 2.2rem;
font-weight: 300;
font-style: italic;
text-align: center;
letter-spacing: -0.02em;
line-height: 1.2;
}

.card-srs-info {
position: absolute;
bottom: 14px;
font-size: 0.6rem;
letter-spacing: 0.04em;
}

.srs-level-0 { color: var(–unknown); }
.srs-level-1 { color: #c88a1a; }
.srs-level-2 { color: #8a9a2a; }
.srs-level-3, .srs-level-4, .srs-level-5 { color: var(–known); }

/* ANSWER BUTTONS */
.answer-btns {
display: flex;
gap: 12px;
margin-top: 22px;
width: 100%;
max-width: 500px;
}

.btn {
font-family: ‘DM Mono’, monospace;
font-size: 0.7rem;
letter-spacing: 0.08em;
text-transform: uppercase;
padding: 10px 0;
flex: 1;
border: 1px solid var(–border);
border-radius: 3px;
background: var(–card-bg);
cursor: pointer;
transition: all 0.15s;
display: flex;
align-items: center;
justify-content: center;
gap: 6px;
}

.btn:hover { transform: translateY(-1px); box-shadow: 0 3px 8px rgba(0,0,0,0.1); }
.btn:active { transform: translateY(0); }

.btn-known {
border-color: var(–known);
color: var(–known);
}
.btn-known:hover { background: var(–known); color: white; }

.btn-unknown {
border-color: var(–unknown);
color: var(–unknown);
}
.btn-unknown:hover { background: var(–unknown); color: white; }

.btn-flip {
border-color: var(–ink);
color: var(–ink);
font-size: 0.65rem;
}
.btn-flip:hover { background: var(–ink); color: var(–bg); }

/* DONE SCREEN */
.done-screen {
display: none;
flex-direction: column;
align-items: center;
justify-content: center;
gap: 16px;
padding: 40px 20px;
text-align: center;
}

.done-screen h2 {
font-family: ‘Fraunces’, serif;
font-size: 2rem;
font-weight: 300;
}

.done-screen p {
color: var(–muted);
font-size: 0.75rem;
line-height: 1.7;
}

.done-screen .btn {
max-width: 260px;
padding: 12px 24px;
}

/* CONTROLS */
.controls {
display: flex;
gap: 8px;
padding: 0 20px 20px;
width: 100%;
max-width: 680px;
flex-wrap: wrap;
}

.ctrl-btn {
font-family: ‘DM Mono’, monospace;
font-size: 0.6rem;
letter-spacing: 0.06em;
text-transform: uppercase;
padding: 6px 14px;
border: 1px solid var(–border);
border-radius: 20px;
background: var(–card-bg);
cursor: pointer;
color: var(–muted);
transition: all 0.15s;
}

.ctrl-btn:hover { border-color: var(–ink); color: var(–ink); }

/* SRS QUEUE INDICATOR */
.queue-info {
width: 100%;
max-width: 680px;
padding: 8px 20px 0;
font-size: 0.62rem;
color: var(–muted);
letter-spacing: 0.04em;
}

/* RESPONSIVE */
@media (max-width: 520px) {
.card-word { font-size: 2rem; }
.card-wrap { height: 240px; }
.card-translation { font-size: 1.7rem; }
}

/* MOBILE OPTIMIZATIONS */
@media (max-width: 768px) {
/* Larger touch targets for mobile */
.btn {
padding: 14px 0;
font-size: 0.75rem;
min-height: 48px;
}

```
.ch-btn {
  padding: 6px 12px;
  font-size: 0.65rem;

}

/* Better card sizing on mobile */
.card-wrap {
  max-width: 100% !important;
  height: 320px !important;

.card-word {
  font-size: 2.2rem !important;

.card-translation {
  font-size: 1.6rem !important;
}

/* Improve answer button layout */

  width: 100%;
  max-width: 100%;
  gap: 12px;
}

.answer-btns button {
  font-size: 0.8rem;
}

/* Better stats layout on small screens */
.stats-bar {
  font-size: 0.6rem;
  gap: 6px;
  flex-wrap: wrap;
}

.stat {
  padding: 5px 8px;
}
```

}

/* Smooth scrolling */
* {
  -webkit-overflow-scrolling: touch;
}

  </div>

  <div class="answer-btns" id="answerBtns" style="display:none">

  <div class="answer-btns" id="flipBtns">

  <div class="done-screen" id="doneScreen">

    <button class="btn btn-known" onclick="resetSession()" style="max-width:260px;padding:12px">
      ↺ Neue Runde
    </button>
    <button class="btn btn-unknown" onclick="resetAll()" style="max-width:260px;padding:12px">
      ⟳ Alles zurücksetzen
    </button>
  </div>
</div>

<div class="controls">
  <button class="ctrl-btn" onclick="shuffleDue()">Mischen</button>
  <button class="ctrl-btn" onclick="showOnlyDue()">Nur fällige</button>
  <button class="ctrl-btn" onclick="showAll()">Alle zeigen</button>
  <button class="ctrl-btn" onclick="resetAll()">Zurücksetzen</button>
</div>

// ─── SRS ENGINE ───────────────────────────────────────────────────────────────
// Levels: 0=new, 1=seen, 2=learnt, 3=mature, 4=strong, 5=mastered
// Intervals (in "rounds"): 0→show always, 1→every2, 2→every3, 3→every5, 4→every8, 5→every13
const INTERVALS = [1, 2, 3, 5, 8, 13];

const STORAGE_KEY = 'rivstart_srs_v1';

function loadState() {
  try {
    const s = localStorage.getItem(STORAGE_KEY);
    return s ? JSON.parse(s) : {};
  } catch { return {}; }
}

function saveState() {
  try { 
    localStorage.setItem(STORAGE_KEY, JSON.stringify(srsState)); 
    console.log('Progress saved:', Object.keys(srsState).length, 'cards, round:', srsState.__round);
  } catch(e) {
    console.error('Save failed:', e);
    alert('Warnung: Fortschritt konnte nicht gespeichert werden. Bitte öffnen Sie die Datei über einen lokalen Webserver oder aktivieren Sie localStorage in Ihren Browser-Einstellungen.');
  }
}

let srsState = loadState();
let roundCounter = (srsState.__round) ? srsState.__round : 0;

function getCard(idx) {
  if (!srsState[idx]) srsState[idx] = { level: 0, nextRound: 0 };
  return srsState[idx];
}

function isDue(idx) {
  const c = getCard(idx);
  return c.nextRound <= roundCounter;
}

function recordAnswer(idx, correct) {
  const c = getCard(idx);
  if (correct) {
    c.level = Math.min(5, c.level + 1);
  } else {
    c.level = Math.max(0, c.level - 1);
  }
  c.nextRound = roundCounter + INTERVALS[c.level];
  srsState[idx] = c;
  saveState();
}

// ─── APP STATE ────────────────────────────────────────────────────────────────
let allCards = RAW.map((r, i) => ({ id: i, sv: r[0], de: r[1], chapter: r[2] }));
let activeChapters = new Set(Array.from({length: 20}, (_, i) => i + 1));
let queue = [];
let currentIdx = -1;
let isFlipped = false;
let sessionCorrect = 0;
let sessionTotal = 0;

// ─── QUEUE BUILDER ────────────────────────────────────────────────────────────
function buildQueue() {
  const filtered = allCards.filter(c => activeChapters.has(c.chapter));
  // Prioritize due cards, then new cards, then scheduled
  const due = filtered.filter(c => isDue(c.id));
  // Shuffle due cards
  for (let i = due.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [due[i], due[j]] = [due[j], due[i]];
  }
  queue = due;
  currentIdx = 0;
  return queue.length;
}

function nextCard() {
  if (queue.length === 0 || currentIdx >= queue.length) {
    showDone();
    return;
  }
  const card = queue[currentIdx];
  showCard(card);
}

// ─── UI ───────────────────────────────────────────────────────────────────────
function showCard(card) {
  const cardEl = document.getElementById('mainCard');
  const wasFlipped = isFlipped;
  isFlipped = false;

  // Parse article from word (en/ett prefix)
  let article = '';
  let word = card.sv;
  if (card.sv.startsWith('en ')) { article = 'en'; word = card.sv.slice(3); }
  else if (card.sv.startsWith('ett ')) { article = 'ett'; word = card.sv.slice(4); }

  const applyContent = () => {
    document.getElementById('cardChapter').textContent = 'Kap. ' + card.chapter;
    document.getElementById('cardChapterBack').textContent = 'Kap. ' + card.chapter;
    document.getElementById('cardNum').textContent = (currentIdx + 1) + ' / ' + queue.length;
    document.getElementById('cardArticle').textContent = article;
    document.getElementById('cardWord').textContent = word;
    document.getElementById('cardTranslation').textContent = card.de;
    const c = getCard(card.id);
    const levelNames = ['Neu','Gesehen','Gelernt','Gefestigt','Stark','Gemeistert'];
    const srsEl = document.getElementById('srsInfo');
    srsEl.textContent = levelNames[c.level];
    srsEl.className = 'card-srs-info srs-level-' + c.level;
  };

  document.getElementById('flipBtns').style.display = 'flex';
  document.getElementById('answerBtns').style.display = 'none';
  document.getElementById('card-wrap').style.display = 'flex';
  document.getElementById('doneScreen').style.display = 'none';

  if (wasFlipped) {
    // Card is currently showing back — flip to front first, then swap content
    cardEl.classList.remove('flipped');
    setTimeout(applyContent, 520);
  } else {
    applyContent();
  }

  updateStats();
}

function flipCard() {
  isFlipped = !isFlipped;
  document.getElementById('mainCard').classList.toggle('flipped', isFlipped);
  if (isFlipped) {
    document.getElementById('flipBtns').style.display = 'none';
    document.getElementById('answerBtns').style.display = 'flex';
  } else {
    document.getElementById('flipBtns').style.display = 'flex';
    document.getElementById('answerBtns').style.display = 'none';
  }
}

function answer(correct) {
  const card = queue[currentIdx];
  recordAnswer(card.id, correct);
  sessionTotal++;
  if (correct) sessionCorrect++;
  roundCounter++;
  srsState.__round = roundCounter;
  saveState();
  currentIdx++;
  nextCard();
}

function showDone() {
  document.getElementById('card-wrap').style.display = 'none';
  document.getElementById('flipBtns').style.display = 'none';
  document.getElementById('answerBtns').style.display = 'none';
  const done = document.getElementById('doneScreen');
  done.style.display = 'flex';
  const pct = sessionTotal > 0 ? Math.round(sessionCorrect / sessionTotal * 100) : 0;
  document.getElementById('doneStats').innerHTML =
    `${sessionCorrect} von ${sessionTotal} Karten richtig (${pct}%)<br><br>Die Karten werden je nach Leistung seltener oder öfter wiederholt.`;
  updateStats();
}

function updateStats() {
  const filtered = allCards.filter(c => activeChapters.has(c.chapter));
  const total = filtered.length;
  const mastered = filtered.filter(c => getCard(c.id).level >= 3).length;
  const unknown = filtered.filter(c => getCard(c.id).level < 2).length;
  const due = filtered.filter(c => isDue(c.id)).length;

  document.getElementById('statTotal').textContent = total;
  document.getElementById('statKnown').textContent = mastered;
  document.getElementById('statUnknown').textContent = unknown;
  document.getElementById('statDue').textContent = due;
  document.getElementById('progressFill').style.width = total > 0 ? (mastered / total * 100) + '%' : '0%';

  document.getElementById('queueInfo').textContent =
    queue.length > 0
      ? 'Karte ' + (currentIdx + 1) + ' von ' + queue.length + ' in dieser Runde'
      : '';
}

// ─── CHAPTER FILTER ───────────────────────────────────────────────────────────
function buildChapterFilter() {
  const cf = document.getElementById('chapterFilter');
  cf.innerHTML = '';

  const allBtn = document.createElement('button');
  allBtn.className = 'ch-btn active';
  allBtn.textContent = 'Alle';
  allBtn.id = 'chAll';
  allBtn.onclick = () => {
    activeChapters = new Set(Array.from({length: 20}, (_, i) => i + 1));
    document.querySelectorAll('.ch-btn').forEach(b => b.classList.remove('active'));
    allBtn.classList.add('active');
    restart();
  };
  cf.appendChild(allBtn);

  for (let k = 1; k <= 20; k++) {
    const btn = document.createElement('button');
    btn.className = 'ch-btn';
    btn.textContent = 'Kap. ' + k;
    btn.dataset.ch = k;
    btn.onclick = function() {
      const ch = parseInt(this.dataset.ch);
      // Single chapter click = exclusive selection (show ONLY this chapter)
      activeChapters = new Set([ch]);
      document.querySelectorAll('.ch-btn').forEach(b => b.classList.remove('active'));
      this.classList.add('active');
      restart();
    };
    cf.appendChild(btn);
  }
}

// ─── CONTROLS ─────────────────────────────────────────────────────────────────
function restart() {
  sessionCorrect = 0;
  sessionTotal = 0;
  const n = buildQueue();
  document.getElementById('doneScreen').style.display = 'none';
  document.getElementById('card-wrap').style.display = 'flex';
  if (n === 0) {
    document.getElementById('queueInfo').textContent = 'Keine fälligen Karten – kommen Sie später wieder!';
    showDone();
  } else {
    nextCard();
  }
}

function shuffleDue() {
  buildQueue();
  nextCard();
}

function showOnlyDue() {
  restart();
}

function showAll() {
  // Reset all nextRound to 0 so everything is due
  allCards.forEach(c => {
    if (srsState[c.id]) srsState[c.id].nextRound = 0;
  });
  saveState();
  restart();
}

function resetSession() {
  restart();
}

function resetAll() {
  srsState = {};
  roundCounter = 0;
  saveState();
  restart();
}

// ─── KEYBOARD ─────────────────────────────────────────────────────────────────
document.addEventListener('keydown', e => {
  if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); flipCard(); }
  if (e.key === 'ArrowRight' || e.key === '1') { if (isFlipped) answer(true); }
  if (e.key === 'ArrowLeft' || e.key === '2') { if (isFlipped) answer(false); }
});

// ─── INIT ─────────────────────────────────────────────────────────────────────
// Check if localStorage is available
try {
  localStorage.setItem('_test', '1');
  localStorage.removeItem('_test');
  console.log('LocalStorage available ✓');
} catch(e) {
  console.error('LocalStorage not available:', e);
  alert('WARNUNG: Ihr Browser blockiert localStorage.\n\n' +
        'Fortschritt kann nicht gespeichert werden!\n\n' +
        'Lösung: Starten Sie einen lokalen Webserver oder öffnen Sie die Datei in einem anderen Browser.\n\n' +
        'Chrome: python3 -m http.server 8000\nFirefox sollte funktionieren.');
}

// Mobile optimizations: prevent double-tap zoom on buttons
let lastTouchEnd = 0;
document.addEventListener('touchend', function(e) {
  const now = Date.now();
  if (now - lastTouchEnd <= 300) {
    e.preventDefault();
  }
  lastTouchEnd = now;
}, false);

// Prevent iOS Safari bounce scroll
document.body.addEventListener('touchmove', function(e) {
  if (e.target === document.body) {
    e.preventDefault();
  }
}, { passive: false });

buildChapterFilter();
restart();
</script>
